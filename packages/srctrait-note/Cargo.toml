[package]
name = "srctrait-note"
version = "1.0.1"
description = "Markdown notes manager"
authors = ["SourceTrait <development@sourcetrait.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sourcetrait/srctrait-note"
homepage = "https://sourcetrait.com"
categories = []
keywords = ["note", "markdown", "srctrait"]
edition = "2024"

[dependencies]
chrono = "0.4"
derive_builder = "0.20"
dirs = "6"
serde = { version = "1", features = ["derive"] }
shellexpand = { version = "3", features = ["path"] }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
toml = "0.8"
srctrait-common-chronox.workspace = true
convert_case = "0.8"

[dev-dependencies]
srctrait-common-testing.workspace = true

[[example]]
name = "example"
test = true
